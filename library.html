
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayOne Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* This resets the spacing so the page layout stays consistent. */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#111;
    font-family:'Josefin Sans', sans-serif;
}

/* This is the main phone screen for the library page. */
.phone-frame{
    width:390px;
    height:844px;
    border-radius:30px;
    padding:30px 25px;
    position:relative;
    overflow:hidden;
    background-image: linear-gradient(rgba(1,1,1,0.836), rgba(0,0,0,0.676)), url('bg.jpg');
    background-position:center;
    background-size:170%;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    border:1px solid white;
}

h1{
    color:white;
    font-size:50px;
    margin-top:10px;
    font-family:"Anton", sans-serif;
    text-align:center;
    font-style:italic;
}

/* This styles the plus button used to open the upload popup. */
.add-btn{
    position:absolute;
    top:20px;
    right:20px;
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    color:white;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.35);
    cursor:pointer;
    transition:transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}

.add-btn:hover{
    transform:scale(1.12);
    background:rgba(255,255,255,0.18);
    box-shadow:
        0 0 10px rgba(255,255,255,0.95),
        0 0 22px rgba(255,255,255,0.85),
        0 0 40px rgba(255,255,255,0.7),
        0 0 65px rgba(255,255,255,0.5);
}

/* This is the popup where the song details and files are entered. */
.popup{
    display:none;
    position:absolute;
    top:100px;
    width:300px;
    padding:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:18px;
    color:white;
    z-index:100;
}

.popup label{
    color:white;
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-size:14px;
}

.popup input[type="text"]{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    font-family:'Josefin Sans', sans-serif;
    font-size:14px;
}

.popup input[type="file"]{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:12px;
}

.popup button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-family:'Josefin Sans', sans-serif;
    background:white;
    color:#333;
    font-weight:bold;
    margin-top:5px;
}

.popup button:hover{
    background:#1ed760;
}

/* This holds the playlist and lets it scroll when there are lots of songs. */
form{
    width:100%;
    max-width:350px;
    padding:15px;
    border-radius:18px;
    backdrop-filter:blur(10px);
    font-family:'Josefin Sans', sans-serif;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.15);
    margin-top:60px;
    max-height:580px;
    overflow-y:auto;
}

/* These styles control how each song appears in the playlist. */
.song-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-radius:12px;
    transition:0.3s;
    cursor:pointer;
    border:1px solid transparent;
}

.song-row:hover{
    background:rgba(255,255,255,0.08);
}

.song-row.playing{
    background:rgba(30,215,96,0.15);
    border:1px solid rgba(30,215,96,0.4);
}

.song-thumb{
    width:50px;
    height:50px;
    border-radius:8px;
    object-fit:cover;
    flex-shrink:0;
    background:#333;
}

.play-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#222;
    border:none;
    color:white;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.play-btn:hover{
    background:#333;
}

.song-row.playing .play-btn{
    background:#1ed760;
    color:black;
}

.delete-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.3);
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.delete-btn:hover{
    color:#ef4444;
}

.song-info{
    flex:1;
    overflow:hidden;
}

.song-title{
    color:white;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-row.playing .song-title{
    color:#1ed760;
}

/* This message shows when the playlist is empty. */
.empty-msg{
    color:rgba(255,255,255,0.4);
    text-align:center;
    padding:30px 0;
    font-size:14px;
}

/* This is the audio player used to play the selected song. */
#audioPlayer{
    width:85%;
    position:absolute;
    bottom:120px;
}

/* This keeps the navigation links at the bottom of the screen. */
.bottom-nav{
    width:90%;
    max-width:320px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:15px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    position:absolute;
    bottom:30px;
}

.bottom-nav a{
    text-decoration:none;
    color:gray;
    font-size:28px;
    transition:0.3s;
}

.bottom-nav a.active{
    color:white;
    animation:glow 1s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 5px white; }
    to{ text-shadow:0 0 15px white; }
}

.bottom-nav a:hover{
    color:#d5d5d5;
    transform:scale(1.3);
}
</style>
</head>

<body>

<div class="phone-frame">

    <!-- This button opens the popup for adding a new song. -->
    <div class="add-btn" onclick="togglePopup()">
        <i class="fa-solid fa-plus"></i>
    </div>

    <!-- Upload Popup -->
    <div class="popup" id="popupBox">
        <label>Song Name</label>
        <input type="text" id="songName" placeholder="e.g. See You Again">

        <label>Artist</label>
        <input type="text" id="songArtist" placeholder="e.g. Tyler the Creator">

        <label>MP3 File</label>
        <input type="file" id="mp3Upload" accept=".mp3,audio/mpeg">

        <label>Image (optional)</label>
        <input type="file" id="imgUpload" accept="image/*">

        <button onclick="uploadSong()">Add Song</button>
    </div>

    <h1>Library</h1>

    <!-- Songs loaded from the server are displayed here. -->
    <form onsubmit="return false;">
        <div id="playlist"></div>
    </form>

    <audio id="audioPlayer"></audio>

    <nav class="bottom-nav">
        <a href="home.html"><i class="fa-solid fa-house"></i></a>
        <a href="library.html" class="active"><i class="fa-solid fa-music"></i></a>
        <a href="profile.html"><i class="fa-solid fa-user"></i></a>
    </nav>

</div>

<script>

// This keeps track of the songs and which one is selected.
let playlist = [];
let currentIndex = -1;
const audio = document.getElementById("audioPlayer");
const API = "http://localhost:3000/api/songs";
const SERVER = "http://localhost:3000";

// Load songs from server
async function loadSongs(){
    try {
        const res = await fetch(API);

        if(!res.ok){
            throw new Error("Could not load songs.");
        }

        const songs = await res.json();

        // Keep track of the currently playing song after reloading
        const currentSong = playlist[currentIndex];
        playlist = songs;
        currentIndex = currentSong
            ? playlist.findIndex(song => song._id === currentSong._id)
            : -1;

        if(currentIndex === -1 && !audio.paused){
            audio.pause();
            audio.src = "";
        }

        renderPlaylist();
    } catch(err) {
        console.error("Failed to load songs:", err);
    }
}

// Upload song to server
async function uploadSong(){
    const songFile = document.getElementById("mp3Upload").files[0];
    const imgFile = document.getElementById("imgUpload").files[0];
    const name = document.getElementById("songName").value.trim();
    const artist = document.getElementById("songArtist").value.trim();

    // This checks that the required song details have been entered.
    if(!songFile || !name){
        alert("Please enter a song name and select an MP3 file.");
        return;
    }

    // This checks the selected file before sending it to the server.
    if(!songFile.name.toLowerCase().endsWith(".mp3") ||
       (songFile.type && songFile.type !== "audio/mpeg")){
        alert("Invalid song file. Please select an MP3 audio file.");
        return;
    }

    // This checks that the cover image is actually an image.
    if(imgFile && !imgFile.type.startsWith("image/")){
        alert("Invalid cover file. Please select an image.");
        return;
    }

    // The files and details are sent together to the server.
    const formData = new FormData();
    formData.append("song", songFile);
    formData.append("name", name);
    formData.append("artist", artist || "Unknown Artist");
    if(imgFile) formData.append("image", imgFile);

    try {
        const res = await fetch(API, {
            method: "POST",
            body: formData
        });

        if(!res.ok){
            const data = await res.json().catch(() => ({}));
            throw new Error(
                data.error || "Upload failed. Please check your selected files."
            );
        }

        // Clear the form once the song has been uploaded.
        document.getElementById("popupBox").style.display = "none";
        document.getElementById("songName").value = "";
        document.getElementById("songArtist").value = "";
        document.getElementById("mp3Upload").value = "";
        document.getElementById("imgUpload").value = "";

        await loadSongs();
    } catch(err) {
        alert(err.message || "Failed to upload song. Please try again.");
        console.error("Failed to upload song:", err);
    }
}

// Delete song
async function deleteSong(id, e){
    e.stopPropagation();

    try {
        const res = await fetch(`${API}/${id}`, {
            method: "DELETE"
        });

        if(!res.ok){
            throw new Error("Delete failed.");
        }

        await loadSongs();
    } catch(err) {
        console.error("Failed to delete song:", err);
        alert("Failed to delete song.");
    }
}

// This rebuilds the playlist using the songs received from the server.
function renderPlaylist(){
    const playlistDiv = document.getElementById("playlist");
    playlistDiv.innerHTML = "";

    // Show a message instead if there are no songs saved.
    if(playlist.length === 0){
        const message = document.createElement("div");
        message.className = "empty-msg";
        message.textContent = "No songs yet — press + to add one";
        playlistDiv.appendChild(message);
        return;
    }

    // This adds each song and its controls to the playlist.
    playlist.forEach((song, index) => {
        const isPlaying = index === currentIndex && !audio.paused;
        const row = document.createElement("div");
        row.className = "song-row" + (index === currentIndex ? " playing" : "");

        const imgSrc = song.imagePath
            ? `${SERVER}/${song.imagePath.replace(/\\/g, "/")}`
            : null;

        const audioSrc = `${SERVER}/${song.songPath.replace(/\\/g, "/")}`;

        const playBtn = document.createElement("button");
        playBtn.className = "play-btn";
        playBtn.innerHTML = `<i class="fa-solid ${isPlaying ? "fa-pause" : "fa-play"}"></i>`;
        playBtn.setAttribute("aria-label", isPlaying ? "Pause song" : "Play song");
        playBtn.addEventListener("click", () => togglePlay(index, audioSrc));

        let thumbnail;

        if(imgSrc){
            thumbnail = document.createElement("img");
            thumbnail.src = imgSrc;
            thumbnail.alt = "";
        } else {
            thumbnail = document.createElement("div");
        }

        thumbnail.className = "song-thumb";

        const info = document.createElement("div");
        info.className = "song-info";

        const title = document.createElement("div");
        title.className = "song-title";
        title.textContent = song.name;

        const artist = document.createElement("div");
        artist.className = "song-artist";
        artist.textContent = song.artist || "Unknown Artist";

        info.append(title, artist);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
        deleteBtn.setAttribute("aria-label", "Delete song");
        deleteBtn.addEventListener("click", e => deleteSong(song._id, e));

        row.append(playBtn, thumbnail, info, deleteBtn);
        playlistDiv.appendChild(row);
    });
}

// This controls playing and pausing songs from the playlist.
function togglePlay(index, src){
    if(currentIndex === index){
        if(audio.paused){
            audio.play().catch(err => {
                console.error("Failed to play song:", err);
                alert("Could not play this song.");
            });
        } else {
            audio.pause();
        }
    } else {
        currentIndex = index;
        audio.src = src;
        audio.play().catch(err => {
            console.error("Failed to play song:", err);
            alert("Could not play this song.");
            renderPlaylist();
        });
    }

    renderPlaylist();
}

// Update the playlist display when the player starts or pauses.
audio.addEventListener("play", renderPlaylist);
audio.addEventListener("pause", renderPlaylist);

// Play the next song when the current one finishes.
audio.addEventListener("ended", () => {
    if(currentIndex < playlist.length - 1 && currentIndex >= 0){
        const next = currentIndex + 1;
        const song = playlist[next];
        const src = `${SERVER}/${song.songPath.replace(/\\/g, "/")}`;
        togglePlay(next, src);
    } else {
        currentIndex = -1;
        renderPlaylist();
    }
});

// This opens or closes the song upload popup.
function togglePopup(){
    const popup = document.getElementById("popupBox");
    popup.style.display = popup.style.display === "block" ? "none" : "block";
}

// Load the saved songs when the page opens.
loadSongs();

</script>

</body>
</html>

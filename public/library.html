<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayOne Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#111;
    font-family:'Josefin Sans', sans-serif;
}

.phone-frame{
    width:390px;
    height:844px;
    border-radius:30px;
    padding:30px 25px;
    position:relative;
    overflow:hidden;
    background-image: linear-gradient(rgba(1,1,1,0.836), rgba(0,0,0,0.676)), url('bg.jpg');
    background-position:center;
    background-size:170%;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    border:1px solid white;
}

h1{
    color:white;
    font-size:50px;
    margin-top:10px;
    font-family:"Anton", sans-serif;
    text-align:center;
    font-style:italic;
}

.add-btn{
    position:absolute;
    top:30px;
    right:30px;
    font-size:25px;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.add-btn:hover{
    transform:scale(1.1);
}

.popup{
    display:none;
    position:absolute;
    top:100px;
    width:300px;
    padding:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:18px;
    color:white;
    z-index:100;
}

.popup label{
    color:white;
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-size:14px;
}

.popup input[type="text"]{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    font-family:'Josefin Sans', sans-serif;
    font-size:14px;
}

.popup input[type="file"]{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:12px;
}

.popup button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-family:'Josefin Sans', sans-serif;
    background:white;
    color:#333;
    font-weight:bold;
    margin-top:5px;
}

.popup button:hover{
    background:#1ed760;
}

form{
    width:100%;
    max-width:350px;
    padding:15px;
    border-radius:18px;
    backdrop-filter:blur(10px);
    font-family:'Josefin Sans', sans-serif;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.15);
    margin-top:60px;
    max-height:580px;
    overflow-y:auto;
}

.song-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-radius:12px;
    transition:0.3s;
    cursor:pointer;
    border:1px solid transparent;
}

.song-row:hover{
    background:rgba(255,255,255,0.08);
}

.song-row.playing{
    background:rgba(30,215,96,0.15);
    border:1px solid rgba(30,215,96,0.4);
}

.song-thumb{
    width:50px;
    height:50px;
    border-radius:8px;
    object-fit:cover;
    flex-shrink:0;
    background:#333;
}

.play-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#222;
    border:none;
    color:white;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.play-btn:hover{
    background:#333;
}

.song-row.playing .play-btn{
    background:#1ed760;
    color:black;
}

.delete-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.3);
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.delete-btn:hover{
    color:#ef4444;
}

.song-info{
    flex:1;
    overflow:hidden;
}

.song-title{
    color:white;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-row.playing .song-title{
    color:#1ed760;
}

.empty-msg{
    color:rgba(255,255,255,0.4);
    text-align:center;
    padding:30px 0;
    font-size:14px;
}

#audioPlayer{
    width:85%;
    position:absolute;
    bottom:120px;
}

.bottom-nav{
    width:90%;
    max-width:320px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:18px;
    padding:15px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    position:absolute;
    bottom:30px;
}

.bottom-nav a{
    text-decoration:none;
    color:gray;
    font-size:28px;
    transition:0.3s;
}

.bottom-nav a.active{
    color:white;
    animation:glow 1s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 5px white; }
    to{ text-shadow:0 0 15px white; }
}

.bottom-nav a:hover{
    color:#d5d5d5;
    transform:scale(1.3);
}
</style>
</head>

<body>

<div class="phone-frame">

    <div class="add-btn" onclick="togglePopup()">
        <i class="fa-solid fa-plus"></i>
    </div>

    <!-- Upload Popup -->
    <div class="popup" id="popupBox">
        <label>Song Name</label>
        <input type="text" id="songName" placeholder="e.g. See You Again">

        <label>Artist</label>
        <input type="text" id="songArtist" placeholder="e.g. Tyler the Creator">

        <label>MP3 File</label>
        <input type="file" id="mp3Upload" accept=".mp3,audio/mpeg">

        <label>Image (optional)</label>
        <input type="file" id="imgUpload" accept="image/*">

        <button onclick="uploadSong()">Add Song</button>
    </div>

    <h1>Library</h1>

    <form>
        <div id="playlist"></div>
    </form>

    <audio id="audioPlayer"></audio>

    <nav class="bottom-nav">
        <a href="home.html"><i class="fa-solid fa-house"></i></a>
        <a href="library.html" class="active"><i class="fa-solid fa-music"></i></a>
        <a href="profile.html"><i class="fa-solid fa-user"></i></a>
    </nav>

</div>

<script>

let playlist = [];
let currentIndex = -1;
const audio = document.getElementById("audioPlayer");
const API = "http://localhost:3000/api/songs";

// Load songs from server
async function loadSongs(){
    try {
        const res = await fetch(API);
        playlist = await res.json();
        renderPlaylist();
    } catch(err) {
        console.error("Failed to load songs:", err);
    }
}

// Upload song to server
async function uploadSong(){
    const songFile = document.getElementById("mp3Upload").files[0];
    const imgFile = document.getElementById("imgUpload").files[0];
    const name = document.getElementById("songName").value.trim();
    const artist = document.getElementById("songArtist").value.trim();

    if(!songFile || !name){
        alert("Please enter a song name and select an MP3 file.");
        return;
    }

    const formData = new FormData();
    formData.append("song", songFile);
    formData.append("name", name);
    formData.append("artist", artist || "Unknown Artist");
    if(imgFile) formData.append("image", imgFile);

    try {
        await fetch(API, { method: "POST", body: formData });
        document.getElementById("popupBox").style.display = "none";
        document.getElementById("songName").value = "";
        document.getElementById("songArtist").value = "";
        document.getElementById("mp3Upload").value = "";
        document.getElementById("imgUpload").value = "";
        loadSongs();
    } catch(err) {
        alert("Failed to upload song.");
        console.error(err);
    }
}

// Delete song
async function deleteSong(id, e){
    e.stopPropagation();
    try {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        loadSongs();
    } catch(err) {
        console.error("Failed to delete song:", err);
    }
}

function renderPlaylist(){
    const playlistDiv = document.getElementById("playlist");
    playlistDiv.innerHTML = "";

    if(playlist.length === 0){
        playlistDiv.innerHTML = `<div class="empty-msg">No songs yet — press + to add one</div>`;
        return;
    }

    playlist.forEach((song, index) => {
        const isPlaying = index === currentIndex && !audio.paused;
        const row = document.createElement("div");
        row.className = "song-row" + (index === currentIndex ? " playing" : "");

        const imgSrc = song.imagePath
            ? `http://localhost:3000/${song.imagePath.replace(/\\/g, "/")}`
            : null;

            console.log("Image src:", imgSrc);

        const audioSrc = `http://localhost:3000/${song.songPath.replace(/\\/g, "/")}`;

        row.innerHTML = `
            <button class="play-btn" onclick="togglePlay(${index}, '${audioSrc}')">
                <i class="fa-solid ${isPlaying ? "fa-pause" : "fa-play"}"></i>
            </button>
            ${imgSrc
                ? `<img src="${imgSrc}" class="song-thumb">`
                : `<div class="song-thumb"></div>`}
            <div class="song-info">
                <div class="song-title">${song.name}</div>
                <div class="song-artist">${song.artist}</div>
            </div>
            <button class="delete-btn" onclick="deleteSong('${song._id}', event)">
                <i class="fa-solid fa-trash"></i>
            </button>
        `;

        playlistDiv.appendChild(row);
    });
}

function togglePlay(index, src){
    if(currentIndex === index){
        if(audio.paused){
            audio.play();
        } else {
            audio.pause();
        }
    } else {
        currentIndex = index;
        audio.src = src;
        audio.play();
    }
    renderPlaylist();
}

audio.addEventListener("play", renderPlaylist);
audio.addEventListener("pause", renderPlaylist);
audio.addEventListener("ended", () => {
    if(currentIndex < playlist.length - 1){
        const next = currentIndex + 1;
        const song = playlist[next];
        const src = `http://localhost:3000/${song.songPath.replace(/\\/g, "/")}`;
        togglePlay(next, src);
    } else {
        currentIndex = -1;
        renderPlaylist();
    }
});

function togglePopup(){
    const popup = document.getElementById("popupBox");
    popup.style.display = popup.style.display === "block" ? "none" : "block";
}

loadSongs();

</script>

</body>
</html>
